
<div id="void-ai-window">

    <div class="void-ai-header">
        <div>
            <h3>VOID AI ✦</h3>
            <p>Tu asistente creativo</p>
        </div>

        <button id="void-ai-close">×</button>
    </div>

    <div id="void-ai-messages">
        <div class="void-ai-message bot">
            ¡Holaaa! Soy VOID AI 💗
            ¿En qué puedo ayudarte?
        </div>
    </div>

    <form class="void-ai-form" id="void-ai-form">
        <input
            type="text"
            id="void-ai-input"
            placeholder="Escribe un mensaje..."
            autocomplete="off"
            required
        >

        <button id="void-ai-send" type="submit">➤</button>
    </form>

</div>

<button id="void-ai-button">
    ✦ VOID AI
</button>
